<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Conversión Celsius a Fahrenheit</title>
<script>
    function convertir() {
        let celsius = parseFloat(document.fdatos.celsius.value);
        let fahrenheit = (celsius * 1.8) + 32;
        document.fdatos.fahrenheit.value = fahrenheit;
    }
</script>
</head>
<body>

<form name="fdatos">
    Introduce grados Celsius (°C): <input type="text" size="10" name="celsius"/>
    <input type="button" value="Convertir" onclick="convertir()"/>
    <br/><br/>
    Grados Fahrenheit (°F): <input type="text" size="10" name="fahrenheit"/>
    <br/><br/>
    <input type="reset" value="Reset"/>
</form>

</body>
</html>
