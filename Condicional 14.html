<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
    let mes = parseInt(prompt("Introduce el número del mes (1 al 12):", "1"));

    if (mes == 1 || mes == 3 || mes == 5 || mes == 7 || mes == 8 || mes == 10 || mes == 12) {
        document.write(`El mes ${mes} tiene 31 días.`);
    } else if (mes == 4 || mes == 6 || mes == 9 || mes == 11) {
        document.write(`El mes ${mes} tiene 30 días.`);
    } else if (mes == 2) {
        document.write(`El mes 2 (Febrero) tiene 28 o 29 días.`);
    } else {
        document.write(`Número de mes inválido (debe ser del 1 al 12).`);
    }
</script>
</body>
</html>
