<!DOCTYPE html>
<html><head>
<meta content="text/html; charset=utf-8">
<script>
    function Saludo(persona1, persona2) {
        document.getElementById("saludo").innerHTML = `Hola ${persona1} y ${persona2}`;
    }
</script>
</head>
<body>
<h1>Función con dos parámetros</h1>
<p>Saluda a dos personas.</p><br>
<p id="saludo">Aquí el resultado</p>

<script>
    let nombre1 = prompt("Introduce el nombre de la primera persona:", "");
    let nombre2 = prompt("Introduce el nombre de la segunda persona:", "");
    Saludo(nombre1, nombre2);
</script>

</body>
</html>
