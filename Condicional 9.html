<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
    let estudiante, edad;

    estudiante = prompt("¿Eres estudiante? (si/no):", "");
    edad = parseInt(prompt("Introduce tu edad:", "0"));

    if ((estudiante.toLowerCase() == "si") && (edad > 18))
    {
        document.write(`<h3>Bienvenid@ al portal web</h3>`);
    }
    else
    {
        document.write(`<h3>No tiene acceso al portal web</h3>`);
    }
</script>
</body>
</html>
