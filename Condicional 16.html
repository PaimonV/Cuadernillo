<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<script>
    let dia, mes, año;
    mes = prompt('Introduzca el número del mes (1 al 12):', '');
    mes = parseInt(mes);

    if (mes >= 1 && mes <= 12)
    {
        if (mes == 1 || mes == 3 || mes == 5 || mes == 7 || mes == 8 || mes == 10 || mes == 12)
        {
            document.write('Este mes tiene 31 dias.');
        }
        else
        {
            if (mes == 2)
                document.write('Este mes puede tener 30 dias.');
            else
                document.write('Este mes tiene 30 dias.');
        }
    }
    else
    {
        document.write('Error: Debe introducir un número de mes válido del 1 al 12.');
    }
</script>
</head>
</html>
