<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script language="javascript">
{
    let num1 = 0, num2 = 0;
    
    let dato1 = window.prompt("Introduce primer número", "0");
    num1 = parseInt(dato1);
    
    let dato2 = window.prompt("Introduce segundo número", "0");
    num2 = parseInt(dato2);

    if (num1 > num2)
    {
        document.write(`El mayor es el primero, ${num1}`);
    }
    else
    {
        if (num2 > num1)
        {
            document.write(`El mayor es el segundo, ${num2}`);
        }
        else
        {
            document.write(`Los números son iguales`);
        }
    }
}
</script>
</body>
</html>
