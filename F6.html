<!DOCTYPE html>
<html><body>
<script>
    let pasaraFahrenheit = (grado) => {return Fahrenheit = grado * 1.8 + 32;};

    let pasaraCelsius = (grado) => {return Celsius = (grado - 32) / 1.8;};

    var result = pasaraFahrenheit(22);
    alert ("Fahrenheit: " + result);

    result = pasaraCelsius(71.6);
    alert ("Celsius: " + result);
</script>
</body>
</html>
