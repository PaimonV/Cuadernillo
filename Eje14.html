<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script language="javascript">
{
    let num = 0;

    while (num !== 7)
    {
        let dato = prompt('Introduce un número:', '');
        num = parseInt(dato);

        document.write(` El numero introducido es ${num} </br> `);
    }

    document.write(` </br><h3>
            Fin del programa
            Has introducido el número 7.
            </h3>
    `);
}
</script>
</body>
</html>
